name: Build Csound (Android)

# Builds the four Android ABIs from source. Csound's own job for this runs inside a Docker
# image on their registry, which is not public, so the NDK that ships with the runner is used
# instead, with their platform/androidcross settings.
#
# Those settings already turn off portaudio, portmidi and the plugins, and build with
# USE_DOUBLE=0: samples are 32 bit on Android, which is what this package's P/Invoke layer
# expects, since MYFLT maps to Single there.

on:
  # Called by update-csound.yml, which builds every platform from one ref. It is still
  # dispatchable on its own, to retry a single platform without rebuilding the rest.
  workflow_call:
    inputs:
      csound_ref:
        description: "Csound tag, branch or commit to build"
        required: false
        type: string
        default: "7.0.0"
  workflow_dispatch:
    inputs:
      csound_ref:
        description: "Csound tag, branch or commit to build"
        required: true
        default: "7.0.0"

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: arm
            abi: armeabi-v7a
          - arch: x86
            abi: x86
          - arch: x64
            abi: x86_64

    steps:
      - name: Checkout Csound
        uses: actions/checkout@v4
        with:
          repository: csound/csound
          ref: ${{ inputs.csound_ref }}
          submodules: true
          path: csound

      - uses: lukka/get-cmake@latest

      - name: Bootstrap vcpkg
        working-directory: csound
        run: ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        working-directory: csound
        # The NDK path comes from the runner's own environment, so it is read in the shell:
        # in an env: expression ${{ env.ANDROID_NDK_LATEST_HOME }} is empty and vcpkg then
        # has no toolchain to build the Android dependencies with.
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "ANDROID_NDK_HOME      = $ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT      = ${ANDROID_NDK_ROOT:-unset}"
          echo "ANDROID_NDK_LATEST    = ${ANDROID_NDK_LATEST_HOME:-unset}"
          ls "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" || echo "toolchain file missing"
          which ninja make cc c++ || true
          # Our own settings file: the same choices as platform/androidcross/custom-android.cmake,
          # without its add_compile_options(-std=c11), which the NDK clang refuses on C++ files.
          cat > cu-android.cmake <<'EOF'
          set(USE_PORTAUDIO 0)
          set(USE_PORTMIDI 0)
          set(BUILD_STATIC_LIBRARY ON)
          set(BUILD_JAVA_INTERFACE OFF)
          set(INSTALL_PYTHON_INTERFACE OFF)
          set(BUILD_UTILITIES OFF)
          set(BUILD_TESTS OFF)
          set(HAVE_TERMCAP OFF)
          set(USE_DOUBLE 0)
          set(BUILD_PLUGINS OFF)
          set(CMAKE_C_STANDARD 11)
          # Devices with 16 KB pages — Android 15 and later — cannot map a library whose
          # segments are aligned to 4 KB, which is what lld would produce here.
          set(CMAKE_SHARED_LINKER_FLAGS
              "${CMAKE_SHARED_LINKER_FLAGS} -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384")
          EOF

          cmake -B build -S . \
            -DUSE_VCPKG=1 \
            -DCUSTOM_CMAKE=./cu-android.cmake \
            -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID=1 \
            -DCMAKE_TARGET_ARCHITECTURE=${{ matrix.arch }} \
            -DUSE_JACK=0 -DUSE_ALSA=0 -DUSE_PULSEAUDIO=0 -DUSE_PIPEWIRE=0 -DUSE_IPMIDI=0

      - name: What vcpkg said, when it failed
        if: failure()
        working-directory: csound
        run: |
          # The configure error only says vcpkg failed; the reason is in its own log.
          for f in build/vcpkg-manifest-install.log build/vcpkg_installed/vcpkg/issue_body.md; do
            [ -f "$f" ] && { echo "===== $f"; tail -60 "$f"; }
          done

      - name: Build
        working-directory: csound
        run: cmake --build build --config Release

      - name: Collect the libraries
        run: |
          mkdir -p out/${{ matrix.abi }}
          # The package ships the Csound library under the name Unity loads, plus libsndfile
          lib=$(find csound/build -name "libcsound.so*" -type f | head -1)
          test -n "$lib" || { echo "::error::libcsound.so not found"; exit 1; }
          cp "$lib" out/${{ matrix.abi }}/libcsoundandroid.so
          # The soname stays libcsound.so while the file is named libcsoundandroid.so, which
          # is what the package loads. Unity loads it by full path, so the two need not
          # match, and setting the soname is not worth what it costs: patchelf rewrites the
          # ELF and appends a segment whose offset stops being congruent with its address
          # once Unity strips the library during the build — and a library whose segments
          # are incongruent is refused by the loader, which then reports it as not found.

          snd=$(find csound -name "libsndfile.so*" -type f | head -1)
          if [ -n "$snd" ]; then
            cp "$snd" out/${{ matrix.abi }}/libsndfile.so
          else
            echo "::warning::libsndfile.so not found, it may be linked statically"
          fi

      - name: Check the exports the package calls
        run: |
          lib=out/${{ matrix.abi }}/libcsoundandroid.so
          file "$lib"
          # The loader refuses anything above 16 KB, and says "library not found" when it
          # does, so this has to be caught here rather than on a device.
          align=$(readelf --wide -l "$lib" | awk '$1=="LOAD" {print strtonum($NF)}' | sort -n | tail -1)
          # An unmeasured segment must fail too: with an empty value $(( )) is 0, which
          # would quietly pass the test below and let a broken library through.
          if [ -z "$align" ]; then
            echo "::error::could not read the segment alignment"; exit 1
          fi
          echo "  max p_align: $align"
          if [ "$align" -gt 16384 ]; then
            echo "::error::segments ask for $align byte pages; Android allows at most 16384"
            exit 1
          fi
          # Every loadable segment must have its offset congruent with its address modulo
          # the alignment, or the loader refuses the library — and says it was not found.
          readelf --wide -l "$lib" | awk '
              $1=="LOAD" {
                  off=strtonum($2); va=strtonum($3); al=strtonum($NF)
                  if (al > 1 && (off % al) != (va % al)) {
                      printf "::error::LOAD segment at offset %d is not congruent with address %d (align %d)\n", off, va, al
                      bad = 1
                  }
              }
              END { exit bad }
          ' || exit 1
          # Which shared libraries it will look for on the device. libsndfile belongs here
          # only if it was not linked in: the package ships one next to it, and the two
          # have to agree about which it is.
          readelf --wide -d "$lib" | sed -n 's/.*SONAME.*\[\(.*\)\]/  soname: \1/p'
          echo "  needs:"
          readelf --wide -d "$lib" | sed -n 's/.*NEEDED.*\[\(.*\)\]/    \1/p'
          for fn in csoundCreate csoundCompileCSD csoundStart csoundPerformKsmps \
                    csoundSetHostAudioIO csoundSetHostMIDIIO csoundGetSpout; do
            readelf --wide --dyn-syms "$lib" | grep -qF "$fn" \
              || { echo "::error::missing export: $fn"; exit 1; }
            echo "  $fn ok"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: csound-android-${{ matrix.abi }}
          path: out/${{ matrix.abi }}
